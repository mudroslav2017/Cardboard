<svg preserveAspectRatio="none" overflow="visible" style="display: block;" width="382.695" height="234.448" viewBox="0 0 382.695 234.448" fill="none" xmlns="http://www.w3.org/2000/svg">
<style>
.factory-gear{transform-box:view-box;animation:factory-spin 20s linear infinite}
.gear-large{transform-origin:71.9137px 127.5725px}
.gear-middle{transform-origin:152.07px 82.5724px;animation-duration:11s;animation-direction:reverse}
.gear-small{transform-origin:24.1008px 193.666px;animation-duration:9s;animation-direction:reverse}
.smoke-puff{fill:#8A6C48;filter:url(#smoke-soften);transform-box:view-box;transform-origin:275px 49px;animation:smoke-rise 4.8s linear infinite;opacity:0}
.puff-two{animation-delay:-1.2s}.puff-three{animation-delay:-2.4s}.puff-four{animation-delay:-3.6s}
.smoke-trail{transform-box:view-box;transform-origin:274px 48px;animation:smoke-curl 4.8s ease-in-out infinite}
@keyframes factory-spin{to{transform:rotate(360deg)}}
@keyframes smoke-rise{0%{transform:translate(0,3px) scale(.45);opacity:0}15%{opacity:.32}65%{opacity:.2}100%{transform:translate(26px,-46px) scale(1.35);opacity:0}}
@keyframes smoke-curl{0%,100%{transform:translate(0,0) skewX(-3deg);opacity:.5}50%{transform:translate(2px,-2px) skewX(3deg);opacity:.8}}
@media(prefers-reduced-motion:reduce){.factory-gear,.smoke-trail{animation:none}.smoke-puff{display:none}}
</style>
<defs><filter id="smoke-soften" x="-60%" y="-60%" width="220%" height="220%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="1.2"/></filter></defs>
